<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exit Poll Comparison Tool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Starter prototype</p>
      <h1>Exit Poll Comparison Tool</h1>
      <p class="lede">Compare current exit poll data against historical baselines, flag suspicious changes, and separate live data from historical data.</p>
    </header>

    <section class="status-card">
      <h2>Data status</h2>
      <div id="metadata">Loading data...</div>
    </section>

    <section class="controls-card">
      <h2>View</h2>
      <div class="controls">
        <label>
          Color perspective
          <select id="perspective-select">
            <option value="raw">Raw movement</option>
            <option value="Dem">Democratic performance</option>
            <option value="GOP">Republican performance</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <h2>Comparison</h2>
      <div id="comparison-table">Loading comparison...</div>
    </section>

    <section>
      <h2>QA flags</h2>
      <div id="qa-flags">Loading QA checks...</div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
